name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, cfs-quick-listing]
    steps:
      - uses: actions/checkout@v4

      - name: Sync into apps directory
        run: |
          set -euo pipefail
          export PATH="/usr/local/bin:/opt/homebrew/bin:$PATH"
          mkdir -p "$HOME/apps"
          if [ ! -d "$HOME/apps/cfs-quick-listing/.git" ]; then
            git clone "https://github.com/${{ github.repository }}.git" "$HOME/apps/cfs-quick-listing"
          fi
          cd "$HOME/apps/cfs-quick-listing"
          git fetch --all --prune
          git reset --hard "${GITHUB_SHA}"
          mkdir -p logs

      - name: Install dependencies
        run: |
          set -euo pipefail
          export PATH="/usr/local/bin:/opt/homebrew/bin:$PATH"
          cd "$HOME/apps/cfs-quick-listing"
          npm ci --omit=optional || npm install --omit=optional

      - name: Reload PM2
        run: |
          set -euo pipefail
          export PATH="/usr/local/bin:/opt/homebrew/bin:$PATH"
          cd "$HOME/apps/cfs-quick-listing"
          if pm2 describe cfs-quick-listing >/dev/null 2>&1; then
            pm2 reload ecosystem.config.cjs --update-env
          else
            pm2 start ecosystem.config.cjs
          fi
          pm2 save

      - name: Health check
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if curl -fsS "http://127.0.0.1:${PORT:-4100}/api/health"; then exit 0; fi
            sleep 2
          done
          echo "Health check failed" >&2
          exit 1
